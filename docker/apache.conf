<VirtualHost *:80>
    DocumentRoot /app
    # OrbStack terminates TLS and forwards the request to Apache over HTTP.
    SetEnvIfNoCase X-Forwarded-Proto "^https$" HTTPS=on
    <Directory /app>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>
    <Files "wp-config.php">
        Require all denied
    </Files>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
